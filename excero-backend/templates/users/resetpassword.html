<!DOCTYPE html>
<html lang="en" class="h-full bg-white">
<head>
    <meta charset="UTF-8">
    <title>Excero - Réinitialisation de votre mot de passe</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,container-queries"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                primary: '#da373d',
              }
            }
          }
        }
    </script>
    <style>
        .error {
            color: rgba(222, 33, 33, 1);
            border-radius: 10px;
        }
    </style>
</head>
<body class="h-full">
{% if user %}
    <div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
        <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
            {% load static %} <img src="{% static 'resources/Full_Branding.png' %}" alt="">
            {% if success %}
                <div class="w-full rounded-md border-0 p-2 text-teal-600 ring-2 ring-inset ring-teal-600 bg-teal-100 outline-teal-600">
                    {{ success }}
                </div>
            {% endif %}
            <form class="space-y-6" method="post" action="">
                {% csrf_token %}
                <div>
                    <label for="username" class="block text-sm font-medium leading-6 text-gray-900">
                        Votre nom d'utilisateur
                    </label>
                    <input type="text" name="username" class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-teal-600 sm:text-sm sm:leading-6" disabled value="{{ user.username }}">
                </div>
                {% for field in form %}
                    <div class="fieldWrapper">
                        <label for="{{ field.html_name }}" class="block text-sm font-medium leading-6 text-gray-900">
                            {{ field.label }}
                        </label>
                        <input type="password" id="{{ field.html_name }}" name="{{ field.html_name }}" class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-teal-600 sm:text-sm sm:leading-6">
                        <div class="error">{{ field.errors }}</div>
                    </div>
                {% endfor %}
                 <div>
                    <button type="submit" class="flex w-full justify-center rounded-md bg-teal-600 px-3 py-1.5 text-sm font-semibold leading-6 text-white shadow-sm hover:bg-teal-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">Confirmer</button>
                 </div>
            </form>
        </div>
    </div>
{% else %}
    <p>La session de réinitialisation de votre mot de passe à expirée. Merci de contacter un administrateur de l'expérience.</p>
{% endif %}
</body>
</html>
